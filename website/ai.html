
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI科研助手 - MaizeGene</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  background: #f5f8f4;
  color: #263a2c;
}

header {
  height: 76px;
  background: white;
  padding: 0 8%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px #0000000d;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: #287a48;
  text-decoration: none;
}

nav a {
  margin-left: 20px;
  color: #526459;
  text-decoration: none;
}

main {
  max-width: 1050px;
  margin: 35px auto;
  padding: 0 20px;
}

h1 { margin-bottom: 8px; }

.subtitle {
  color: #728177;
  line-height: 1.8;
}

.chat {
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 25px #0000000a;
  overflow: hidden;
  margin-top: 25px;
}

.chat-header {
  padding: 20px 25px;
  background: #e9f5ec;
  border-bottom: 1px solid #dcebe0;
}

.chat-header strong {
  color: #287a48;
  font-size: 18px;
}

.chat-header p {
  margin: 8px 0 0;
  font-size: 13px;
  color: #65766b;
}

.messages {
  height: 440px;
  overflow-y: auto;
  padding: 25px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.message {
  padding: 15px 20px;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.assistant {
  align-self: flex-start;
  background: #f0f5f1;
}

.user {
  align-self: flex-end;
  background: #287a48;
  color: white;
}

.input-area {
  padding: 20px;
  border-top: 1px solid #edf0ed;
  display: flex;
  gap: 12px;
}

textarea {
  flex: 1;
  min-width: 0;
  height: 65px;
  resize: vertical;
  padding: 14px;
  border: 1px solid #d9e5dc;
  border-radius: 10px;
  font: inherit;
}

button {
  background: #287a48;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 0 25px;
  cursor: pointer;
}

button:hover { background: #1f623a; }

.notice {
  background: #fff5df;
  padding: 16px;
  border-radius: 10px;
  margin-top: 20px;
  color: #81622d;
  line-height: 1.8;
}

@media (max-width: 600px) {
  header { padding: 0 16px; }
  nav a { margin-left: 10px; font-size: 13px; }
  .messages { height: 380px; padding: 14px; }
  .message { max-width: 95%; }
  .input-area { padding: 12px; }
  button { padding: 0 15px; }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">🌽 MaizeGene</a>
  <nav>
    <a href="index.html">首页</a>
    <a href="literature.html">文献检索</a>
  </nav>
</header>

<main>

<h1>🤖 AI 科研助手</h1>
<p class="subtitle">
  围绕玉米基因、功能注释与科研证据开展问答。
</p>

<div class="chat">

  <div class="chat-header">
    <strong>MaizeGene 科研助手</strong>
    <p>科研对话界面 · 功能开发中</p>
  </div>

  <div class="messages" id="messages">
    <div class="message assistant">
你好！我是 MaizeGene 科研助手。

你可以尝试输入关于玉米基因的问题。

目前聊天界面已可使用，但真实 AI 问答与知识图谱检索服务尚未接入。
    </div>
  </div>

  <div class="input-area">
    <textarea
      id="question"
      placeholder="例如：哪些玉米基因可能与抗旱性有关？"
    ></textarea>
    <button onclick="sendMessage()">发送</button>
  </div>

</div>

<div class="notice">
  ⚠ 当前为交互演示版本。
  系统不会生成未经检索核验的科研结论。
  后续接入模型及证据检索服务后，
  将展示参考文献、证据等级和不确定性。
</div>

</main>

<script>
const messages = document.getElementById("messages");
const question = document.getElementById("question");

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  messages.appendChild(message);
  messages.scrollTop = messages.scrollHeight;
}

function sendMessage() {
  const text = question.value.trim();

  if (!text) return;

  addMessage(text, "user");
  question.value = "";

  addMessage(
    "已收到你的问题。\n\n" +
    "当前尚未接入 AI 模型和知识图谱检索接口，" +
    "因此暂时无法提供有证据支持的科研答案。\n\n" +
    "你可以先进入「文献检索」页面，" +
    "查询已有文献的标题、摘要及 DOI 来源。",
    "assistant"
  );
}

question.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
