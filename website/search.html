
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基因搜索 - MaizeGene</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f5f8f4;
      color: #25382b;
    }

    header {
      background: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px #0000000d;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #287a48;
      text-decoration: none;
    }

    a { color: #287a48; text-decoration: none; }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 { font-size: 30px; }

    .subtitle { color: #718076; }

    .search-box {
      display: flex;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin: 25px 0;
      box-shadow: 0 4px 16px #0000000a;
    }

    input {
      flex: 1;
      min-width: 0;
      border: none;
      padding: 18px;
      font-size: 16px;
      outline: none;
    }

    button {
      background: #287a48;
      color: white;
      border: none;
      padding: 0 28px;
      cursor: pointer;
    }

    button:hover { background: #1b6037; }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      margin-top: 20px;
      box-shadow: 0 4px 16px #00000008;
    }

    .card h2 {
      color: #287a48;
      margin-top: 0;
    }

    .tag {
      display: inline-block;
      padding: 6px 12px;
      background: #e6f3e9;
      color: #287a48;
      border-radius: 8px;
      font-size: 13px;
    }

    .button-link {
      display: inline-block;
      margin-top: 15px;
      background: #287a48;
      color: white;
      padding: 11px 20px;
      border-radius: 8px;
    }

    .notice {
      background: #fff5df;
      border-left: 4px solid #d6a14b;
      padding: 15px;
      border-radius: 8px;
      line-height: 1.8;
    }

    .muted {
      color: #718076;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header { padding: 16px; }
      h1 { font-size: 25px; }
      .card { padding: 20px; }
    }
  </style>
</head>

<body>

<header>
  <a class="logo" href="index.html">🌽 MaizeGene</a>
  <a href="index.html">返回首页</a>
</header>

<main class="container">

  <h1>🔍 基因搜索结果</h1>
  <p class="subtitle">搜索玉米基因及相关功能信息</p>

  <div class="search-box">
    <input id="searchInput"
      placeholder="输入基因 ID 或关键词">
    <button onclick="doSearch()">搜索</button>
  </div>

  <p id="searchSummary" class="muted"></p>

  <div class="notice">
    当前为界面演示版本，尚未接入真实数据库。
    搜索结果仅用于测试页面跳转，不代表数据库匹配或科研结论。
  </div>

  <div id="results"></div>

</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const keyword = params.get("q") || "";

  const input = document.getElementById("searchInput");
  const summary = document.getElementById("searchSummary");
  const results = document.getElementById("results");

  input.value = keyword;

  function doSearch() {
    const value = input.value.trim();

    if (!value) {
      summary.textContent = "请先输入搜索关键词";
      results.replaceChildren();
      return;
    }

    window.location.href =
      "search.html?q=" + encodeURIComponent(value);
  }

  function showResults() {
    if (!keyword.trim()) {
      summary.textContent = "请输入关键词开始搜索";
      return;
    }

    summary.textContent = "当前搜索内容：" + keyword;

    // 本阶段只为指定示例基因提供演示卡片
    if (keyword.toLowerCase() === "zm00001eb081920") {
      const card = document.createElement("div");
      card.className = "card";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "演示记录";

      const title = document.createElement("h2");
      title.textContent = "Zm00001eb081920";

      const description = document.createElement("p");
      description.className = "muted";
      description.textContent =
        "示例基因 ID。点击查看详情页布局，功能注释尚未接入。";

      const link = document.createElement("a");
      link.className = "button-link";
      link.href = "gene.html?id=" +
        encodeURIComponent("Zm00001eb081920");
      link.textContent = "查看基因详情 →";

      card.append(tag, title, description, link);
      results.appendChild(card);
    } else {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = "暂无可展示的演示记录";

      const description = document.createElement("p");
      description.className = "muted";
      description.textContent =
        "真实数据库尚未接入，因此目前无法判断该关键词是否存在对应基因。可以输入 Zm00001eb081920 测试完整页面流程。";

      card.append(title, description);
      results.appendChild(card);
    }
  }

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") doSearch();
  });

  showResults();
</script>

</body>
</html>
