services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH}
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_LANGUAGE: en
      WHISPER_CACHE_DIR: /models
      AUDIO_MAX_BYTES: ${AUDIO_MAX_BYTES:-10485760}
      AUDIO_MAX_SECONDS: ${AUDIO_MAX_SECONDS:-60}
    volumes:
      - speech-models:/models
  web:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_BIND:-127.0.0.1}:${WEB_HTTP_PORT:-8080}:80"
      - "${WEB_HTTPS_BIND:-127.0.0.1}:${WEB_HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
volumes:
  speech-models:
  caddy-data:
  caddy-config:
